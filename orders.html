<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — FOODIES.COM</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/darkmode.css" />
  <link rel="stylesheet" href="css/modern.css" />
  <script>(function(){const t=localStorage.getItem('foodies_theme');if(t==='dark'||(t==null&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')})();</script>
</head>
<body>

  <!-- Sidebar + Main Layout -->
  <div class="dash-layout">

    <!-- Mobile Overlay -->
    <div class="dash-overlay" id="dashOverlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="dash-sidebar" id="sidebar">
      <div class="dash-brand">FOODIES<span>.</span>COM</div>
      <nav class="dash-nav">
        <a href="index.html"  class="dash-nav-item"><i class="bi bi-house-fill"></i> Home</a>
        <a href="orders.html" class="dash-nav-item active"><i class="bi bi-bag-check-fill"></i> My Orders</a>
        <a href="profile.html" class="dash-nav-item"><i class="bi bi-person-fill"></i> Profile</a>
        <a href="#" class="dash-nav-item" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
        <div class="admin-nav-divider"></div>
        <button class="dash-dark-toggle" data-dark-toggle><i class="bi bi-moon-fill"></i> Dark Mode</button>
      </nav>
      <div class="dash-sidebar-footer">
        <div class="dash-user-info" id="sidebarUser"></div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dash-main">
      <div class="dash-topbar">
        <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <h2>My Orders</h2>
        <div style="display:flex;gap:10px;align-items:center;">
          <button class="btn-reorder" id="reorderBtn" onclick="reorderLast()">
            <i class="bi bi-arrow-repeat"></i> Reorder
          </button>
          <a href="index.html" class="btn-order-now"><i class="bi bi-plus-lg"></i> Order Again</a>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="order-filter-tabs">
        <button class="tab-btn active" data-status="all" onclick="filterOrders(this)">All Orders</button>
        <button class="tab-btn" data-status="placed"           onclick="filterOrders(this)">Placed</button>
        <button class="tab-btn" data-status="confirmed"        onclick="filterOrders(this)">Confirmed</button>
        <button class="tab-btn" data-status="out_for_delivery" onclick="filterOrders(this)">On The Way</button>
        <button class="tab-btn" data-status="delivered"        onclick="filterOrders(this)">Delivered</button>
        <button class="tab-btn" data-status="cancelled"        onclick="filterOrders(this)">Cancelled</button>
        <!-- Auto-refresh indicator -->
        <div class="auto-refresh-badge" id="autoRefreshBadge" title="Auto-refreshing every 30s">
          <span class="refresh-dot"></span> Live
        </div>
      </div>

      <!-- Orders List -->
      <div id="ordersContainer">
        <div class="dash-loader"><div class="loader-ring"></div></div>
      </div>
    </main>
  </div>

  <!-- Order Detail Modal -->
  <div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content dash-modal">
        <div class="modal-header">
          <h5 class="modal-title">Order Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="orderModalBody"></div>
      </div>
    </div>
  </div>

  <!-- Review Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content dash-modal">
        <div class="modal-header">
          <h5 class="modal-title">⭐ Write a Review</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p id="reviewItemName" style="font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:#0d0d0d;margin-bottom:16px;"></p>
          <input type="hidden" id="reviewItemId">

          <!-- Star Rating -->
          <div style="margin-bottom:16px;">
            <label class="co-label">Your Rating *</label>
            <div class="star-rating" id="starRating">
              <span data-val="1" onclick="setRating(1)">☆</span>
              <span data-val="2" onclick="setRating(2)">☆</span>
              <span data-val="3" onclick="setRating(3)">☆</span>
              <span data-val="4" onclick="setRating(4)">☆</span>
              <span data-val="5" onclick="setRating(5)">☆</span>
            </div>
            <p id="ratingText" style="font-size:0.8rem;color:#999;margin-top:4px;"></p>
          </div>

          <!-- Comment -->
          <div>
            <label class="co-label">Your Review (optional)</label>
            <textarea class="co-input" id="reviewComment" rows="3" placeholder="Share your experience with this dish..."></textarea>
          </div>

          <div id="reviewAlert" style="display:none;margin-top:12px;padding:10px 14px;border-radius:10px;font-size:0.85rem;font-weight:500;"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-auth" style="max-width:160px;" onclick="submitReview()">
            <span id="reviewBtnText"><i class="bi bi-star-fill"></i> Submit Review</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <style>
    .star-rating { display:flex; gap:6px; cursor:pointer; }
    .star-rating span {
      font-size:2rem; color:#ddd; transition:color 0.15s ease; line-height:1; user-select:none;
    }
    .star-rating span.filled { color:#f39c12; }
    .star-rating span:hover { transform:scale(1.15); }
    .btn-review {
      padding:6px 16px; border-radius:9px; border:2px solid #f39c12;
      color:#f39c12; background:transparent; font-size:0.8rem; font-weight:700;
      cursor:pointer; transition:all 0.25s ease;
    }
    .btn-review:hover { background:#f39c12; color:white; }
    .btn-review.reviewed { border-color:#16a085; color:#16a085; }
    .btn-review.reviewed:hover { background:#16a085; color:white; }
  </style>

  <!-- Delivery Map Modal -->
  <div class="modal fade" id="deliveryMapModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="border-radius:20px;overflow:hidden;border:none;">
        <div class="modal-header" style="background:linear-gradient(135deg,#c0392b,#e74c3c);color:white;border:none;">
          <h5 class="modal-title"><i class="bi bi-geo-alt-fill"></i> Live Delivery Tracking</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" onclick="DeliveryMap.destroy()"></button>
        </div>
        <div class="modal-body" style="padding:0;">
          <div id="deliveryMapEl" style="width:100%;height:400px;background:#f8f5f0;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/darkmode.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/features.js"></script>
</body>
</html>
