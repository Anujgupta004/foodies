# ============================================
# FOODIES.COM — Render.com Deploy Config
# ============================================
# This file auto-configures your Render service.
# Just connect your GitHub repo on render.com
# and it will read these settings automatically.
# ============================================

services:
  - type: web
    name: foodies-demo
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node standalone.js
    plan: free

    # Auto-deploy on every git push to main branch
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secure random value
      - key: CLIENT_URL
        value: https://foodies-demo.onrender.com
      # Razorpay keys — add manually in Render dashboard if you want real payments
      # - key: RAZORPAY_KEY_ID
      #   value: rzp_test_xxxx
      # - key: RAZORPAY_KEY_SECRET
      #   value: xxxx
