<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — FOODIES.COM</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/darkmode.css" />
  <link rel="stylesheet" href="css/modern.css" />
  <script>(function(){const t=localStorage.getItem('foodies_theme');if(t==='dark'||(t==null&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')})();</script>
</head>
<body>
  <div class="auth-wrapper">
    <!-- Left Panel -->
    <div class="auth-left">
      <div class="auth-left-content">
        <a href="index.html" class="auth-logo">FOODIES<span>.</span>COM</a>
        <div class="auth-visual">
          <img src="img/img/eat.jpg" alt="Food" class="auth-food-img" style="border-radius:20px; object-fit:cover;">
          <div class="auth-visual-circle"></div>
        </div>
        <h2>Join 12,000+<br><span>Food Lovers.</span></h2>
        <p>Create your free account and get 25% off your first order with code FOODIES25.</p>
        <div class="auth-badges">
          <span>🎁 First Order Discount</span>
          <span>📦 Order Tracking</span>
          <span>💳 Secure Checkout</span>
        </div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="auth-right">
      <div class="auth-form-box">
        <a href="index.html" class="auth-back"><i class="bi bi-arrow-left"></i> Back to Home</a>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Join us — it's completely free!</p>

        <div id="authAlert" class="auth-alert" style="display:none;"></div>

        <form id="registerForm" novalidate>
          <div class="row g-3">
            <div class="col-12">
              <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrap">
                  <i class="bi bi-person"></i>
                  <input type="text" id="regName" placeholder="Anuj Gupta" required autocomplete="name">
                </div>
                <span class="field-error" id="nameErr"></span>
              </div>
            </div>
            <div class="col-12">
              <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrap">
                  <i class="bi bi-envelope"></i>
                  <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email">
                </div>
                <span class="field-error" id="emailErr"></span>
              </div>
            </div>
            <div class="col-12">
              <div class="form-group">
                <label>Phone Number</label>
                <div class="input-wrap">
                  <i class="bi bi-telephone"></i>
                  <input type="tel" id="regPhone" placeholder="+91 9876543210" autocomplete="tel">
                </div>
              </div>
            </div>
            <div class="col-12">
              <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                  <i class="bi bi-lock"></i>
                  <input type="password" id="regPassword" placeholder="At least 6 characters" required autocomplete="new-password">
                  <button type="button" class="toggle-pass" onclick="togglePass('regPassword', this)">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <span class="field-error" id="passErr"></span>
                <div class="password-strength" id="passStrength"></div>
              </div>
            </div>
            <div class="col-12">
              <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrap">
                  <i class="bi bi-lock-fill"></i>
                  <input type="password" id="regConfirm" placeholder="Repeat your password" required autocomplete="new-password">
                </div>
                <span class="field-error" id="confirmErr"></span>
              </div>
            </div>
          </div>

          <div class="form-check-custom mt-3">
            <input type="checkbox" id="agreeTerms" required>
            <label for="agreeTerms">I agree to the <a href="#">Terms</a> & <a href="#">Privacy Policy</a></label>
          </div>
          <span class="field-error" id="termsErr"></span>

          <button type="submit" class="btn-auth mt-3" id="registerBtn">
            <span>Create My Account</span>
            <div class="btn-loader" style="display:none;"></div>
          </button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <div class="auth-switch">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/darkmode.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Password strength meter
    document.getElementById('regPassword').addEventListener('input', function () {
      const val = this.value;
      const el = document.getElementById('passStrength');
      if (!val) { el.innerHTML = ''; return; }
      let strength = 0;
      if (val.length >= 6) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;
      const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
      const colors = ['', '#e74c3c', '#f39c12', '#27ae60', '#16a085'];
      el.innerHTML = `<div class="strength-bar"><div style="width:${strength * 25}%; background:${colors[strength]}"></div></div><span style="color:${colors[strength]}">${labels[strength]}</span>`;
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();
      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const phone    = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regConfirm').value;
      const agreed   = document.getElementById('agreeTerms').checked;

      let valid = true;
      if (!name)                      { showFieldErr('nameErr',    'Name is required');               valid = false; }
      if (!email)                     { showFieldErr('emailErr',   'Email is required');              valid = false; }
      if (password.length < 6)        { showFieldErr('passErr',    'Password must be 6+ characters'); valid = false; }
      if (password !== confirm)       { showFieldErr('confirmErr', 'Passwords do not match');         valid = false; }
      if (!agreed)                    { showFieldErr('termsErr',   'Please accept the terms');        valid = false; }
      if (!valid) return;

      setLoading(true);
      try {
        const data = await apiFetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, phone })
        });
        if (!data.success) throw new Error(data.message);

        localStorage.setItem('foodies_token', data.token);
        localStorage.setItem('foodies_user', JSON.stringify(data.user));

        showAlert('success', '🎉 Account created! Redirecting...');
        setTimeout(() => { window.location.href = 'index.html'; }, 1200);
      } catch (err) {
        showAlert('error', err.message);
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
